                          format: date-time
                  transitions:
                    type: array
                    items:
                      type: object
                      required:
                      - seq
                      - to_status
                      - reason
                      - actor
                      - cause
                      - created_at
                      properties:
                        seq:
                          type: integer
                        from_status:
                          type:
                          - string
                          - 'null'
                        to_status:
                          $ref: ../finding/finding-status.v2.schema.json
                        reason:
                          type: string
                        evidence_id:
                          $ref: ../common/ids.v2.schema.json#/$defs/Id
                        actor:
                          $ref: ../common/ids.v2.schema.json#/$defs/Actor
                        cause:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                  assessments:
                    type: array
                    items:
                      $ref: ../finding/severity-assessment.v2.schema.json
