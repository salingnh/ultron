    post:
      tags:
      - findings
      operationId: assessFinding
      summary: Đánh giá mức nghiêm trọng do agent (C07) cho một finding
      description: 'Gọi M04 với output schema của severity-assessment.v2 và lưu một
        dòng severity_assessment mới; mã gán assessed_by/inputs/trigger/dedup_key.
        Cùng finding và cùng input_revision trả bản ghi đã có, không gọi model lần
        nữa. Model lỗi/không cấu hình thì ghi bản ghi UNRATED có failure (kind=rule)
        và trả 200: không có mức nghiêm trọng giả, lịch sử giữ nguyên. M20 cũng đánh giá tự
        động khi một finding được tạo hoặc đầu vào của nó đổi (mọi finding, không chỉ KEV/EPSS),
        giới hạn bởi ngân sách LLM của campaign; hết ngân sách thì finding giữ UNRATED kèm lý do.
        Endpoint này là lần đánh giá theo yêu cầu (trigger=operator_request) trên cùng runtime.'
      security:
      - operatorToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
