openapi: 3.1.0
info:
  title: AEGIS–Vanguard API
  version: 2.0.0
  description: 'REST API v2 (bản nháp S1). M26 phục vụ mọi endpoint, trừ `/ingestion/results`
    do M27 phục vụ.

    Nguồn: docs/living/dac-ta-ky-thuat/05-du-lieu-api-su-kien.md.

    Trạng thái hình dạng: endpoint không có `x-aegis-status` là `locked` — hình
    dạng đã khóa và là căn cứ để viết code. `x-aegis-status: locked` ghi rõ điều đó
    khi cần; `deferred` là endpoint chưa làm trong GĐ1, luôn kèm `x-aegis-reason`
    (và `x-aegis-owner` khi đã có card) và **không** được viết code dựa vào;
    `proposed` bị cấm sau S1 follow-up — không còn endpoint nào ở trạng thái này.


    Quy ước:

    - POST tạo tài nguyên bắt buộc `Idempotency-Key`: cùng key cùng body trả kết quả
    cũ (kèm header `Idempotent-Replayed: true`); cùng key khác body trả 409.

    - POST hành động (pause/resume/cancel) an toàn khi gửi lại: trạng thái đích đã
    đạt thì trả 200 với trạng thái hiện tại.

    - Lỗi luôn theo `Error` (mã chuẩn theo error schema) kèm `trace_id`. Job bị policy từ chối trả
    403 và phát `policy.denied.v2`.

    - Danh sách dùng cursor (`cursor`, `limit` ≤ 200), không dùng offset. `next_cursor`
    vắng = hết.

    - Người vận hành xác thực bằng bearer token riêng của mình (OD-5); server kiểm token
    và chỉ làm việc với principal mờ, không nhận actor từ body. Giữa dịch vụ dùng service
    token (header `X-Aegis-Service-Token`).

    - Header `traceparent` (W3C) được nhận và trả lại; thiếu thì server sinh.

    '
servers:
- url: /api/v2
tags:
- name: campaigns
  description: M01/M02
- name: jobs
  description: M05/M06
- name: ingestion
  description: M27
- name: graph
  description: M07/M23
- name: findings
  description: M20/M21/M24
- name: reports
  description: M24
paths:
  /campaigns:
    post:
      tags:
      - campaigns
      operationId: createCampaign
      summary: Tạo chiến dịch kèm ảnh chụp RoE
      security:
      - operatorToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../campaign/campaign-create.v2.schema.json
      responses:
        '202':
          description: Đã nhận; workflow khởi động bất đồng bộ.
          headers:
            Idempotent-Replayed:
              description: '`true` khi cùng Idempotency-Key + cùng body trả lại kết quả đã commit.'
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                type: object
                required:
                - campaign_id
                - status
                - policy_version
                - scope_id
                properties:
                  campaign_id:
                    $ref: ../common/ids.v2.schema.json#/$defs/Id
                  status:
                    const: CREATED
                  policy_version:
                    $ref: ../common/ids.v2.schema.json#/$defs/PolicyVersion
                  scope_id:
                    $ref: ../common/ids.v2.schema.json#/$defs/Id
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    get:
      tags:
      - campaigns
      operationId: listCampaigns
      summary: Danh sách chiến dịch (cho màn hình quản lý chiến dịch)
      security:
      - operatorToken: []
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: status
        in: query
        schema:
          $ref: ../campaign/campaign.v2.schema.json#/$defs/CampaignStatus
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /campaigns/{campaign_id}:
    parameters:
    - $ref: '#/components/parameters/CampaignId'
    get:
      tags:
      - campaigns
      operationId: getCampaign
      summary: Trạng thái, ngân sách, bộ đếm
      security:
      - operatorToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../campaign/campaign.v2.schema.json
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /campaigns/{campaign_id}/policy:
    parameters:
    - $ref: '#/components/parameters/CampaignId'
    post:
      tags:
      - campaigns
      operationId: updateCampaignPolicy
      summary: Đổi RoE, sinh policy_version mới (bản cũ không bị sửa)
      description: 'Append một policy_snapshot mới (policy_version mới do DB cấp) rồi adopt
        làm current_policy_version; dòng cũ không bị sửa. Lý do ghi vào audit row cùng giao dịch.
        Campaign đã terminal (COMPLETED/FAILED/CANCELLED) trả 409.'
      security:
      - operatorToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - policy
              - reason
              properties:
                policy:
                  $ref: ../campaign/roe-policy.v2.schema.json
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - policy_version
                properties:
                  policy_version:
                    $ref: ../common/ids.v2.schema.json#/$defs/PolicyVersion
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /campaigns/{campaign_id}/pause:
    parameters:
    - $ref: '#/components/parameters/CampaignId'
    post:
      tags:
      - campaigns
      operationId: pauseCampaign
      summary: Tạm dừng
      description: 'Ghi campaign.status=PAUSED kèm một dòng campaign_status_change và audit
        actor trong cùng giao dịch. Tín hiệu pause tới workflow Temporal do M02 phát (G1.1d);
        gọi lại khi đã PAUSED trả 200 với trạng thái hiện tại và không ghi thêm lịch sử.'
      security:
      - operatorToken: []
      requestBody:
        $ref: '#/components/requestBodies/ReasonRequest'
      responses:
        '200':
          $ref: '#/components/responses/CampaignState'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /campaigns/{campaign_id}/resume:
    parameters:
    - $ref: '#/components/parameters/CampaignId'
    post:
      tags:
      - campaigns
      operationId: resumeCampaign
      summary: Tiếp tục
      description: 'Ghi campaign.status=RUNNING (đặt started_at lần đầu) kèm lịch sử và audit;
        tín hiệu resume tới workflow do M02 phát (G1.1d). Gọi lại khi đã chạy trả 200.'
      security:
      - operatorToken: []
      requestBody:
        $ref: '#/components/requestBodies/ReasonRequest'
      responses:
        '200':
          $ref: '#/components/responses/CampaignState'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /campaigns/{campaign_id}/cancel:
    parameters:
    - $ref: '#/components/parameters/CampaignId'
    post:
      tags:
      - campaigns
      operationId: cancelCampaign
      summary: Hủy chiến dịch
      description: 'Ghi campaign.status=CANCELLED (đặt ended_at) kèm lịch sử và audit; lệnh hủy
        tới job đang chạy do M02 phát (G1.1d). Gọi lại khi đã CANCELLED trả 200 với trạng thái
        hiện tại; campaign đã COMPLETED/FAILED trả 409.'
      security:
      - operatorToken: []
      requestBody:
        $ref: '#/components/requestBodies/ReasonRequest'
      responses:
        '200':
          $ref: '#/components/responses/CampaignState'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /campaigns/{campaign_id}/events:
    parameters:
    - $ref: '#/components/parameters/CampaignId'
    get:
      tags:
      - campaigns
      operationId: streamCampaignEvents
      summary: Dòng thời gian; SSE khi Accept text/event-stream, JSON phân trang khi
        Accept application/json
      security:
      - operatorToken: []
      description: 'SSE: mỗi message `id: <outbox seq>`, `event: <type>`, `data: <EventEnvelope
        JSON>`. Client nối lại bằng `Last-Event-ID`.

        Cần operator token như mọi thao tác campaign (OD-5); thiếu hoặc sai token trả 401 trước
        khi mở stream.


        Server gửi `event: heartbeat` mỗi 15 giây.

        '
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: types
        in: query
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
      - name: Last-Event-ID
        in: header
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/event-stream:
              schema:
                type: string
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: ../events/event-envelope.v2.schema.json
                  next_cursor:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
  /campaigns/{campaign_id}/flow:
    parameters:
    - $ref: '#/components/parameters/CampaignId'
    get:
      tags:
      - campaigns
      operationId: getCampaignFlow
      x-aegis-status: locked
      x-aegis-locked-by: G1.5a
      summary: Dữ liệu màn hình luồng quét (React Flow) - phiên agent, quyết định
        policy, job và quan hệ cha con
      security:
      - operatorToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - nodes
                - edges
                - revision
                properties:
                  revision:
                    type: integer
                  nodes:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - type
                      - status
                      - label
                      properties:
                        id:
                          type: string
                        type:
                          enum:
                          - campaign
                          - session
                          - decision
                          - job
                          - finding_batch
                        status:
                          description: Trạng thái của node. Node `job` mang đúng JobStatus của
                            job.v2 (cùng nguồn với scan_job.status); loại node khác mang trạng thái
                            của module tương ứng, không tái dùng JobStatus.
                          type: string
                          minLength: 1
                        label:
                          type: string
                        error:
                          $ref: ../common/error.v2.schema.json
                        attempt:
                          type: integer
                          minimum: 1
                          description: Fencing token của lần dispatch (0007), bắt buộc với node
                            `job` và vắng mặt với node khác — một job luôn ≥ 1, không có 0.
                        generation:
                          type: integer
                          minimum: 1
                          description: Generation tái thực thi (0007), bắt buộc với node `job` và
                            vắng mặt với node khác.
                        cancel:
                          $ref: ../capability/job.v2.schema.json#/$defs/CancelIntent
                        wait_reason:
                          $ref: ../capability/job.v2.schema.json#/$defs/WaitReason
                        started_at:
                          type: string
                          format: date-time
                        finished_at:
                          type: string
                          format: date-time
                      allOf:
                      - if:
                          properties:
                            type:
                              const: job
                          required:
                          - type
                        then:
                          properties:
                            status:
                              $ref: ../capability/job.v2.schema.json#/$defs/JobStatus
                          required:
                          - attempt
                          - generation
                      - if:
                          properties:
                            type:
                              not:
                                const: job
                          required:
                          - type
                        then:
                          not:
                            required:
                            - attempt
                            - generation
                  edges:
                    type: array
                    items:
                      type: object
                      required:
                      - from
                      - to
                      properties:
                        from:
                          type: string
                        to:
                          type: string
                        kind:
                          type: string
        '401':
          $ref: '#/components/responses/Error'
  /capabilities:
    get:
      tags:
      - jobs
      operationId: listCapabilities
      summary: Danh sách capability và provider (Registry M05)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                      - capability
                      - providers
                      properties:
                        capability:
                          $ref: ../common/ids.v2.schema.json#/$defs/CapabilityId
                        input_schema_ref:
                          type: string
                        providers:
                          type: array
                          items:
                            type: object
                            required:
                            - name
                            - version
                            - health
                            properties:
                              name:
                                type: string
                              version:
                                type: string
                              module:
                                type: string
                              health:
                                enum:
                                - healthy
                                - degraded
                                - unavailable
  /jobs:
    post:
      tags:
      - jobs
      operationId: submitJob
      summary: Gửi job (vẫn qua điểm kiểm M05)
      security:
      - operatorToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../capability/job-submit.v2.schema.json
      responses:
        '202':
          description: Đã duyệt và xếp hàng
          content:
            application/json:
              schema:
                $ref: ../capability/job.v2.schema.json
        '200':
          description: Trùng job_fingerprint, trả job cũ
          content:
            application/json:
              schema:
                $ref: ../capability/job.v2.schema.json
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
    get:
      tags:
      - jobs
      operationId: listJobs
      x-aegis-status: locked
      description: 'Danh sách job của một chiến dịch, khóa ở G1.1c cùng `/jobs`. Thứ tự keyset
        `(created_at, job_id)` tăng dần; `next_cursor` vắng = hết trang. `status` lọc theo
        JobStatus. Job trong danh sách mang cùng hình dạng job.v2 như `GET /jobs/{job_id}`
        (kể cả `wait_reason` và `dispatch_block_reasons`), nên màn hình job lỗi không cần
        một endpoint thứ hai.'
      summary: Danh sách job (màn hình job lỗi)
      security:
      - operatorToken: []
      parameters:
      - name: campaign_id
        in: query
        required: true
        schema:
          $ref: ../common/ids.v2.schema.json#/$defs/Id
      - name: status
        in: query
        schema:
          $ref: ../capability/job.v2.schema.json#/$defs/JobStatus
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: ../capability/job.v2.schema.json
                  next_cursor:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
  /jobs/{job_id}:
    parameters:
    - $ref: '#/components/parameters/JobId'
    get:
      tags:
      - jobs
      operationId: getJob
      summary: Trạng thái và tham chiếu kết quả
      security:
      - operatorToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../capability/job.v2.schema.json
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /jobs/{job_id}/cancel:
    parameters:
    - $ref: '#/components/parameters/JobId'
    post:
      tags:
      - jobs
      operationId: cancelJob
      summary: Hủy job (best effort, báo kết quả trung thực)
      security:
      - operatorToken: []
      description: 'Ghi cancel intent (cancel.requested_at/requested_by) rồi để M06 dừng container và
        terminal hóa. Intent KHÔNG tự đổi trạng thái và không ghi đè kết quả terminal đã nhận trước
        đó; job còn chờ (QUEUED) có thể terminal CANCELLED ngay sau intent. Gửi lại khi job chưa
        terminal trả 200 với intent đã có (không ghi trùng); job đã terminal trả 200 với trạng thái
        hiện tại và giữ nguyên lý do hủy trong lịch sử.'
      requestBody:
        $ref: '#/components/requestBodies/ReasonRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../capability/job.v2.schema.json
        '401':
          $ref: '#/components/responses/Error'
  /ingestion/results:
    post:
      tags:
      - ingestion
      operationId: ingestResult
      summary: Nhận ResultEnvelope (chỉ dịch vụ nội bộ, service token)
      description: 'Idempotent theo dedup_key và payload_hash (aegis-c14n/1) của kết quả logic;
        event_id chỉ định danh lần nộp. Không cần Idempotency-Key. Collector đóng băng snapshot
        nghiệp vụ và gửi lại nguyên nội dung khi retry; đổi riêng event_id hoặc trace không tạo
        nội dung mới. Bản ghi không qua cổng G1-G7 bị cách ly, envelope vẫn được nhận. Quy tắc
        canonical hóa và trường được băm: ../ingestion/canonicalization.v2.yaml.'
      security:
      - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../ingestion/result-envelope.v2.schema.json
      responses:
        '202':
          description: Đã nhận, hoặc trả lại receipt đã commit trước đó với duplicate=true (cùng payload_hash).
          content:
            application/json:
              schema:
                $ref: ../ingestion/ingest-receipt.v2.schema.json
        '400':
          $ref: '#/components/responses/Error'
        '409':
          description: 'IDEMPOTENCY_CONFLICT: dedup_key đã có nội dung khác (payload_hash khác, hoặc
            hash chưa có version trước 0006). Server ghi nhận lần nộp vào ingestion_attempt và không
            thay đổi receipt, revision hay dữ liệu đã nhận; không ghi đè.'
          content:
            application/json:
              schema:
                $ref: ../common/error.v2.schema.json
  /assets:
    get:
      tags:
      - graph
      operationId: listAssets
      x-aegis-status: deferred
      x-aegis-reason: 'Truy vấn asset/cursor chưa khóa; graph/history theo asset_id đã khóa.'
      x-aegis-owner: G1.4a
      summary: Tìm tài sản theo chiến dịch, kind hoặc tiền tố khóa (điểm vào màn hình
        đồ thị)
      parameters:
      - name: campaign_id
        in: query
        schema:
          $ref: ../common/ids.v2.schema.json#/$defs/Id
      - name: kind
        in: query
        schema:
          $ref: ../common/ids.v2.schema.json#/$defs/AssetKind
      - name: q
        in: query
        description: Tiền tố canonical_key hoặc alias
        schema:
          type: string
          maxLength: 256
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Asset'
                  next_cursor:
                    type: string
  /assets/{asset_id}/graph:
    parameters:
    - $ref: '#/components/parameters/AssetId'
    get:
      tags:
      - graph
      operationId: getAssetGraph
      summary: Vùng lân cận có giới hạn (cùng truy vấn get_asset_neighbors của agent)
      parameters:
      - name: campaign_id
        in: query
        required: true
        schema:
          $ref: ../common/ids.v2.schema.json#/$defs/Id
      - name: max_hops
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 2
          default: 1
      - name: as_of
        in: query
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../mcp/graph-queries.v2.schema.json#/$defs/get_asset_neighbors/properties/output
  /assets/{asset_id}/history:
    parameters:
    - $ref: '#/components/parameters/AssetId'
    get:
      tags:
      - graph
      operationId: getAssetHistory
      summary: Dòng thời gian tài sản theo từng lần chạy (observation gắn scan_id)
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - asset
                - items
                properties:
                  asset:
                    $ref: '#/components/schemas/Asset'
                  items:
                    type: array
                    items:
                      type: object
                      required:
                      - scan_id
                      - observed_at
                      - predicate
                      - polarity
                      properties:
                        scan_id:
                          $ref: ../common/ids.v2.schema.json#/$defs/Id
                        capability:
                          type: string
                        provider:
                          type: string
                        observed_at:
                          type: string
                          format: date-time
                        predicate:
                          type: string
                        value: {}
                        polarity:
                          enum:
                          - present
                          - absent
                          - negated
                        evidence_ids:
                          type: array
                          items:
                            $ref: ../common/ids.v2.schema.json#/$defs/Id
                  next_cursor:
                    type: string
  /findings:
    get:
      tags:
      - findings
      operationId: listFindings
      summary: Lọc và xuất findings
      parameters:
      - name: campaign_id
        in: query
        schema:
          $ref: ../common/ids.v2.schema.json#/$defs/Id
      - name: asset_id
        in: query
        schema:
          $ref: ../common/ids.v2.schema.json#/$defs/Id
      - name: status
        in: query
        schema:
          type: array
          items:
            $ref: ../finding/finding-status.v2.schema.json
        style: form
        explode: false
      - name: severity
        in: query
        schema:
          type: array
          items:
            $ref: ../finding/severity-assessment.v2.schema.json#/$defs/Severity
        style: form
        explode: false
      - name: category
        in: query
        schema:
          type: string
      - name: vulnerability_id
        in: query
        schema:
          type: string
      - name: kev
        in: query
        schema:
          type: boolean
      - name: changed_since
        in: query
        schema:
          type: string
          format: date-time
      - name: format
        in: query
        description: Định dạng báo cáo JSON
        schema:
          enum:
          - json
          default: json
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: ../finding/finding.v2.schema.json
                  next_cursor:
                    type: string
  /findings/{finding_id}:
    parameters:
    - $ref: '#/components/parameters/FindingId'
    get:
      tags:
      - findings
      operationId: getFinding
      summary: Chi tiết finding kèm bằng chứng (signed URL)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../finding/finding.v2.schema.json
        '404':
          $ref: '#/components/responses/Error'
  /findings/{finding_id}/transitions:
    parameters:
    - $ref: '#/components/parameters/FindingId'
    post:
      tags:
      - findings
      operationId: transitionFinding
      summary: Đổi trạng thái finding kèm lý do (kiểm theo finding/transitions.v2.yaml)
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../finding/transition-request.v2.schema.json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../finding/finding.v2.schema.json
        '400':
          $ref: '#/components/responses/Error'
        '409':
          description: Chuyển trạng thái không hợp lệ hoặc expected_seq lệch
          content:
            application/json:
              schema:
                $ref: ../common/error.v2.schema.json
  /findings/{finding_id}/history:
    parameters:
    - $ref: '#/components/parameters/FindingId'
    get:
      tags:
      - findings
      operationId: getFindingHistory
      summary: Trạng thái và mức nghiêm trọng theo từng lần chạy (FindingRun) cùng
        các lần chuyển trạng thái
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - runs
                - transitions
                - assessments
                properties:
                  runs:
                    type: array
                    items:
                      type: object
                      required:
                      - scan_id
                      - seen
                      - status
                      - severity
                      - observed_at
                      properties:
                        scan_id:
                          $ref: ../common/ids.v2.schema.json#/$defs/Id
                        seen:
                          type: boolean
                        status:
                          $ref: ../finding/finding-status.v2.schema.json
                        severity:
                          $ref: ../finding/severity-assessment.v2.schema.json#/$defs/Severity
                        severity_reason:
                          type: string
                        evidence_id:
                          $ref: ../common/ids.v2.schema.json#/$defs/Id
                        observed_at:
                          type: string
                          format: date-time
                  transitions:
                    type: array
                    items:
                      type: object
                      required:
                      - seq
                      - to_status
                      - reason
                      - actor
                      - cause
                      - created_at
                      properties:
                        seq:
                          type: integer
                        from_status:
                          type:
                          - string
                          - 'null'
                        to_status:
                          $ref: ../finding/finding-status.v2.schema.json
                        reason:
                          type: string
                        evidence_id:
                          $ref: ../common/ids.v2.schema.json#/$defs/Id
                        actor:
                          $ref: ../common/ids.v2.schema.json#/$defs/Actor
                        cause:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                  assessments:
                    type: array
                    items:
                      $ref: ../finding/severity-assessment.v2.schema.json
  /reports/delta:
    get:
      tags:
      - reports
      operationId: getDeltaReport
      summary: Báo cáo thay đổi giữa hai thời điểm
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: campaign_id
        in: query
        schema:
          $ref: ../common/ids.v2.schema.json#/$defs/Id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - from
                - to
                - assets_new
                - assets_gone
                - findings_new
                - findings_changed
                - findings_fixed
                - findings_regressed
                properties:
                  from:
                    type: string
                    format: date-time
                  to:
                    type: string
                    format: date-time
                  assets_new:
                    type: array
                    items:
                      $ref: '#/components/schemas/Asset'
                  assets_gone:
                    type: array
                    items:
                      $ref: '#/components/schemas/Asset'
                  findings_new:
                    type: array
                    items:
                      $ref: ../finding/finding.v2.schema.json
                  findings_changed:
                    type: array
                    items:
                      $ref: ../finding/finding.v2.schema.json
                  findings_fixed:
                    type: array
                    items:
                      $ref: ../finding/finding.v2.schema.json
                  findings_regressed:
                    type: array
                    items:
                      $ref: ../finding/finding.v2.schema.json
components:
  securitySchemes:
    operatorToken:
      type: http
      scheme: bearer
      description: 'Token riêng của người vận hành. Server băm token, so với store cấu hình
        và trả principal mờ (opaque); token không xuất hiện trong log, DB hay body. Actor
        của mọi dòng lịch sử/audit lấy từ principal này (OD-5, C05).'
    serviceToken:
      type: apiKey
      in: header
      name: X-Aegis-Service-Token
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 256
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    CampaignId:
      name: campaign_id
      in: path
      required: true
      schema:
        $ref: ../common/ids.v2.schema.json#/$defs/Id
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        $ref: ../common/ids.v2.schema.json#/$defs/Id
    AssetId:
      name: asset_id
      in: path
      required: true
      schema:
        $ref: ../common/ids.v2.schema.json#/$defs/Id
    FindingId:
      name: finding_id
      in: path
      required: true
      schema:
        $ref: ../common/ids.v2.schema.json#/$defs/Id
  requestBodies:
    ReasonRequest:
      description: 'Lý do cho một hành động (pause/resume/cancel). Body không mang actor —
        actor của dòng lịch sử do server gán từ principal đã xác minh (C05, X-8).'
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - reason
            properties:
              reason:
                type: string
                maxLength: 2000
  responses:
    Error:
      description: Lỗi chuẩn
      content:
        application/json:
          schema:
            $ref: ../common/error.v2.schema.json
    CampaignState:
      description: Trạng thái hiện tại sau thao tác
      content:
        application/json:
          schema:
            $ref: ../campaign/campaign.v2.schema.json
  schemas:
    Asset:
      type: object
      required:
      - asset_id
      - canonical_key
      - kind
      - first_seen
      - last_seen
      properties:
        asset_id:
          $ref: ../common/ids.v2.schema.json#/$defs/Id
        canonical_key:
          $ref: ../common/ids.v2.schema.json#/$defs/CanonicalKey
        kind:
          $ref: ../common/ids.v2.schema.json#/$defs/AssetKind
        owner:
          type:
          - string
          - 'null'
        exposure:
          enum:
          - internet
          - internal
          - unknown
          - null
        criticality:
          enum:
          - high
          - medium
          - low
          - unknown
          - null
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        aliases:
          type: array
          items:
            type: object
            properties:
              namespace:
                type: string
              value:
                type: string
        discovered_from:
          type: array
          items:
            $ref: ../common/ids.v2.schema.json#/$defs/CanonicalKey
    CampaignPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: ../campaign/campaign.v2.schema.json
        next_cursor:
          type: string
