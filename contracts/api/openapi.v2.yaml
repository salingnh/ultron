  /intel/status:
    get:
      tags:
      - intel
      operationId: getIntelStatus
      summary: Độ tươi của intel và lần đồng bộ gần nhất (NVD/EPSS/KEV)
      description: 'Mỗi feed mà `sync-intel` làm mới có mặt trong `feeds`: snapshot mới nhất theo
        `fetched_at`, tuổi tính bằng giây, và `stale` khi tuổi vượt ngưỡng của feed. Feed chưa có
        snapshot vẫn xuất hiện với `snapshot: null` và `stale: true`, nên một lịch hỏng hiện ra bằng
        tuổi tăng dần chứ không phải bằng dòng bị thiếu. `last_run` là lần chạy gần nhất trong
        `intel_sync_run` (kể cả RUNNING), với `legs` từng feed và lỗi của feed hỏng.

        Đây là read model: không kích hoạt sync, không ghi gì. Cần operator token.

        '
      security:
      - operatorToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - generated_at
                - stale_feeds
                - feeds
                - last_run
                properties:
                  generated_at:
                    type: string
                    format: date-time
                  stale_feeds:
                    type: array
                    items:
                      type: string
                  feeds:
                    type: array
                    items:
                      type: object
                      required:
                      - feed
                      - stale
                      - age_seconds
                      - snapshot
                      properties:
                        feed:
                          type: string
                        stale:
                          type: boolean
                        age_seconds:
                          type:
                          - integer
                          - 'null'
                          minimum: 0
                        snapshot:
                          type:
                          - object
                          - 'null'
                          required:
                          - version
                          - snapshot_at
                          - fetched_at
                          - record_count
                          properties:
                            version:
                              type: string
                            snapshot_at:
                              type: string
                              format: date-time
                            fetched_at:
                              type: string
                              format: date-time
                            record_count:
                              type: integer
                              minimum: 0
                  last_run:
                    type:
                    - object
                    - 'null'
                    required:
                    - run_id
                    - trigger
                    - status
                    - started_at
                    - finished_at
                    - legs
                    - error
                    properties:
                      run_id:
                        $ref: ../common/ids.v2.schema.json#/$defs/Id
                      trigger:
                        enum:
                        - schedule
                        - manual
                      status:
                        enum:
                        - RUNNING
                        - SUCCEEDED
                        - FAILED
                      started_at:
                        type: string
                        format: date-time
                      finished_at:
                        type:
                        - string
                        - 'null'
                        format: date-time
                      legs:
                        type: object
                        additionalProperties: true
                      error:
                        type:
                        - string
                        - 'null'
        '401':
          $ref: '#/components/responses/Error'
  /reports/snapshot:
    get:
      tags:
      - reports
      operationId: getSnapshotReport
      summary: Báo cáo JSON của finding tại một thời điểm
      description: 'Ảnh chụp đọc từ dữ liệu đã lưu: mỗi finding lấy trạng thái theo `finding_transition`
        và mức nghiêm trọng theo `severity_assessment` có `created_at` không muộn hơn `as_of`,
        kèm evidence và sha256 của lần quan sát không muộn hơn `as_of`. `first_seen` là lúc M20
        tạo hàng; `last_seen` trong ảnh là lần quan sát gần nhất không muộn hơn `as_of` (rơi về
        `first_seen` khi chưa có). `assets` là các tài sản có ít nhất một finding mở tại `as_of`
        (không FIXED/FALSE_POSITIVE/ACCEPTED_RISK): đó là tồn kho phơi nhiễm mà báo cáo delta so
        sánh. Cột của `asset` là bộ đệm hiện hành; lịch sử nằm ở finding/transition.

        `counts` tổng hợp theo trạng thái và mức nghiêm trọng của chính ảnh chụp. Không phân
        trang: đây là bản xuất, không phải màn hình danh sách. Cần operator token.

        '
      security:
      - operatorToken: []
      parameters:
      - name: as_of
        in: query
        schema:
          type: string
          format: date-time
        description: Thời điểm của ảnh chụp (mặc định hiện tại).
      - name: campaign_id
        in: query
        schema:
          $ref: ../common/ids.v2.schema.json#/$defs/Id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - generated_at
                - as_of
                - counts
                - findings
                - assets
                properties:
                  generated_at:
                    type: string
                    format: date-time
                  as_of:
                    type: string
                    format: date-time
                  campaign_id:
                    $ref: ../common/ids.v2.schema.json#/$defs/Id
                  counts:
                    type: object
                    required:
                    - findings
                    - assets
                    - by_status
                    - by_severity
                    properties:
                      findings:
                        type: integer
                        minimum: 0
                      assets:
                        type: integer
                        minimum: 0
                      by_status:
                        type: object
                        additionalProperties:
                          type: integer
                          minimum: 0
                      by_severity:
                        type: object
                        additionalProperties:
                          type: integer
                          minimum: 0
                  findings:
                    type: array
                    items:
                      $ref: ../finding/finding.v2.schema.json
                  assets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /reports/delta:
    get:
      tags:
      - reports
      operationId: getDeltaReport
      summary: Báo cáo thay đổi giữa hai thời điểm
      description: 'So sánh hai ảnh chụp của `/reports/snapshot` (cùng `campaign_id`), nên mọi
        danh sách là một phép so sánh tập hợp từ dữ liệu đã lưu, không phải một truy vấn khác
        nhau cho từng mục. Mỗi finding nằm trong đúng một danh sách: `findings_fixed` khi trạng
        thái tại `to` là FIXED và tại `from` chưa FIXED; `findings_regressed` khi REGRESSED và
        trước đó chưa REGRESSED; nếu không, `findings_new` khi chưa có tại `from` và
        `findings_changed` khi có ở cả hai mà trạng thái (ngoài hai ca trên) hoặc mức nghiêm
        trọng khác. Thứ tự ưu tiên fixed/regressed trước new: một finding vừa xuất hiện vừa được
        đóng trong cùng cửa sổ nằm ở `findings_fixed` và không lặp lại. `assets_new`/`assets_gone`
        là thay đổi của tồn kho tài sản đang phơi nhiễm (asset có finding mở), nên cũng không
        trùng nhau. `from` phải trước `to`. Cần operator token.

        '
      security:
      - operatorToken: []
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: campaign_id
        in: query
        schema:
          $ref: ../common/ids.v2.schema.json#/$defs/Id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - from
                - to
                - assets_new
                - assets_gone
                - findings_new
                - findings_changed
                - findings_fixed
                - findings_regressed
                properties:
                  from:
                    type: string
                    format: date-time
                  to:
                    type: string
                    format: date-time
                  assets_new:
                    type: array
                    items:
                      $ref: '#/components/schemas/Asset'
                  assets_gone:
                    type: array
                    items:
                      $ref: '#/components/schemas/Asset'
                  findings_new:
                    type: array
                    items:
                      $ref: ../finding/finding.v2.schema.json
                  findings_changed:
                    type: array
                    items:
                      $ref: ../finding/finding.v2.schema.json
                  findings_fixed:
                    type: array
                    items:
                      $ref: ../finding/finding.v2.schema.json
                  findings_regressed:
                    type: array
                    items:
                      $ref: ../finding/finding.v2.schema.json
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    operatorToken:
      type: http
      scheme: bearer
      description: 'Token riêng của người vận hành. Server băm token, so với store cấu hình
        và trả principal mờ (opaque); token không xuất hiện trong log, DB hay body. Actor
        của mọi dòng lịch sử/audit lấy từ principal này (OD-5, C05).'
    serviceToken:
      type: apiKey
      in: header
      name: X-Aegis-Service-Token
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 256
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    CampaignId:
      name: campaign_id
      in: path
      required: true
      schema:
        $ref: ../common/ids.v2.schema.json#/$defs/Id
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        $ref: ../common/ids.v2.schema.json#/$defs/Id
    AssetId:
      name: asset_id
      in: path
      required: true
      schema:
        $ref: ../common/ids.v2.schema.json#/$defs/Id
    FindingId:
      name: finding_id
      in: path
      required: true
      schema:
        $ref: ../common/ids.v2.schema.json#/$defs/Id
  requestBodies:
    ReasonRequest:
      description: 'Lý do cho một hành động (pause/resume/cancel). Body không mang actor —
        actor của dòng lịch sử do server gán từ principal đã xác minh (C05, X-8).'
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - reason
            properties:
              reason:
                type: string
                maxLength: 2000
  responses:
    Error:
      description: Lỗi chuẩn
      content:
        application/json:
          schema:
            $ref: ../common/error.v2.schema.json
    CampaignState:
      description: Trạng thái hiện tại sau thao tác
      content:
        application/json:
          schema:
            $ref: ../campaign/campaign.v2.schema.json
  schemas:
    Asset:
      type: object
      required:
      - asset_id
      - canonical_key
      - kind
      - first_seen
      - last_seen
      properties:
        asset_id:
          $ref: ../common/ids.v2.schema.json#/$defs/Id
        canonical_key:
          $ref: ../common/ids.v2.schema.json#/$defs/CanonicalKey
        kind:
          $ref: ../common/ids.v2.schema.json#/$defs/AssetKind
        owner:
          type:
          - string
          - 'null'
        exposure:
          enum:
          - internet
          - internal
          - unknown
          - null
        criticality:
          enum:
          - high
          - medium
          - low
          - unknown
          - null
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        aliases:
          type: array
          items:
            type: object
            properties:
              namespace:
                type: string
              value:
                type: string
        discovered_from:
          type: array
          items:
            $ref: ../common/ids.v2.schema.json#/$defs/CanonicalKey
    CampaignPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: ../campaign/campaign.v2.schema.json
        next_cursor:
          type: string
