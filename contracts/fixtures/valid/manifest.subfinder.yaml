apiVersion: aegis.io/v1
kind: CapabilityProvider
metadata:
  name: subfinder
  version: 1.0.0
  module: M08
  license: MIT
  upstream: https://github.com/projectdiscovery/subfinder
spec:
  capability: dns.enumerate_subdomains
  providerVersion: v2.6.6
  integrationLevel: L1
  runtime:
    type: container
    image: registry.internal/aegis/subfinder
    imageDigest: "sha256:1111111111111111111111111111111111111111111111111111111111111111"
    argsTemplate: ["-silent", "-json", "-o", "/out/result.jsonl", "-dL", "/in/targets.txt"]
    outputPath: /out
  inputSchemaRef: schema://dns/enumerate-subdomains/v1
  outputSchemaRef: schema://common/result-envelope/v1
  impactTier: T0
  acceptsTargetKinds: [domain]
  permissions: {scopeRequired: false, networkAccess: passive, rawSocket: false}
  safety:
    defaultProfile: passive
    approvalRequired: false
    profiles:
      passive: {recursive: false}
  budget: {timeoutSeconds: 900, maxConcurrency: 4, cpu: 1, memoryMb: 512, maxOutputMb: 64}
  handlers: [describe, validate, start, status, cancel, collect, health]
  parser: {entrypoint: "adapters.m08.subfinder.parser:parse", outputFormat: jsonl}
  emits: {assetKinds: [domain], predicates: [asset.seen], relationships: [SUBDOMAIN_OF], findings: false}
  compatibilityTests: [schema, policy, cancellation, idempotency, fixture-replay, network-isolation]
