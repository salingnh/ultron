apiVersion: aegis.io/v2
kind: CapabilityProvider
metadata:
  name: dnsx
  version: 1.0.0
  module: M09
  license: MIT
  upstream: https://github.com/projectdiscovery/dnsx
spec:
  capability: dns.resolve
  providerVersion: v1.2.3
  runtime:
    type: container
    imageDigest: sha256:2222222222222222222222222222222222222222222222222222222222222222
    argsTemplate:
    - -json
    - -rl
    - '10'
    - -l
    - /in/targets.txt
  inputSchemaRef: schema://dns/resolve/v2
  outputSchemaRef: schema://common/result-envelope/v2
  acceptsTargetKinds:
  - domain
  permissions:
    scopeRequired: false
    networkAccess: egress
    egressMode: broker
    proxyAware: true
    egressSources:
    - id: resolver
      hosts:
      - 1.1.1.1
      ports:
      - 53
      protocol: udp
    targetBinding: required
    targetPorts: from_input
    rawSocket: false
  budget:
    timeoutSeconds: 600
    maxConcurrency: 4
    cpu: 1
    memoryMb: 256
    maxOutputMb: 32
  handlers:
  - describe
  - validate
  - start
  - status
  - cancel
  - collect
  - health
  parser:
    entrypoint: adapters.m09.dnsx.parser:parse
    outputFormat: jsonl
  emits:
    assetKinds:
    - ip
    predicates:
    - asset.seen
    findings: false
  compatibilityTests:
  - schema
  - policy
  - network-isolation
  - fixture-replay
  inputDefaults:
    recursive: false
