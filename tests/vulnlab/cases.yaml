# Vulnlab testcase catalog (G1.6, slice E): known-vulnerable HTTP services and what the discovery
# chain must say about them.
#
# The stack is `deploy/vulnlab/compose.yaml` (compose project `aegis-vulnlab`). Each case is one
# origin service. The `lab` profile targets the origin on the authorized lab network
# (`aegis-lab-lab`), so the origin's own port and Server banner are visible; the `internet` profile
# targets the public hostname published through the Cloudflare Tunnel, where Cloudflare terminates
# TLS, normalizes the `Server` header and hides the origin port (owner note on item 61, 2026-11-25).
# Expectations that cannot hold over the tunnel are `null` and say so, instead of being asserted
# from a guess.
#
# CVE ids are the candidate set a CPE+version matcher must return, taken from NVD 2.0 with
# `virtualMatchString` for the exact CPE below (feed snapshot recorded in `feed`). `mustInclude` is
# a curated subset of that set (well-known ids and every KEV entry); extra candidates are reported,
# not failed. `mustNotInclude` are ids a matcher must not attribute to this version - usually the
# famous CVE of a component whose version the app does not disclose (S2-045, Log4Shell,
# Spring4Shell), so a product-only match cannot fake it.
#
# Detection only: nothing here sends an exploit payload (dynamic verification is G2).
apiVersion: aegis.io/v2
kind: VulnLabCaseCatalog
version: 1

feed:
  nvd:
    retrievedAt: "2026-11-25"
    source: "NVD API 2.0 /cves/2.0 virtualMatchString per CPE below, resultsPerPage=2000"
  kev:
    catalogVersion: "2026.11.24"
    releasedAt: "2026-11-24"
    source: "CISA KEV catalog (cisagov/kev-data mirror), known_exploited_vulnerabilities.json"

network:
  lab: aegis-lab-lab
  internal: aegis-vulnlab-net
  subnet: 10.114.54.0/24
  labSubnet: 10.114.53.0/24
  egress: aegis-vulnlab-egress

campaign:
  # Same shape as the G1.5c lab demo: the campaign's own caps bound what a case may do. The
  # authorization label makes the run auditable (owner authorization: item 61, salingnh.com).
  policy:
    # `lab` for PROFILE=lab: the origins live on the lab network; an operator campaign defaults to
    # `internet` (broker + rate caps), which would never reach them.
    network_profile: lab
    max_parallel_jobs: 2
    max_duration_hours: 1
    rate_limits:
      requests_per_second_per_host: 5
    budget:
      max_jobs: 10
      # roe-policy.v2 floors this at 3 (a lower value is INPUT_INVALID at POST /campaigns).
      idle_cycles_before_pause: 3
  timeoutSeconds: 600

cases:
  - id: httpd-2.4.49
    title: "Apache httpd 2.4.49 - path traversal / RCE (CVE-2021-41773, CVE-2021-42013)"
    imageEnv: AEGIS_VULNLAB_HTTPD_IMAGE
    imageVersion: "2.4.49"
    version: "2.4.49"
    license: Apache-2.0
    service: httpd
    imagePort: 80
    request:
      path: /nosuch
    disclose:
      # Probe path is a missing page (404 with the banner); the campaign expectation describes `/`.
      status: 404
      server: "Apache/2.4.49"
      bodyContains: ["404 Not Found"]
    lab:
      address: 10.114.53.61
      port: 80
    internet:
      hostEnv: AEGIS_VULNLAB_HOST_HTTPD
    expect:
      lab:
        ip: 10.114.53.61
        ports: [80]
        # Evidence (G1.6b, 2026-11-25, probe from aegis-lab-lab): `GET /` answers 200 with
        # `<body><h1>It works!</h1></body>` and `Server: Apache/2.4.49 (Unix)`; the page has no
        # <title> element, so no title is asserted. Only a missing path is 404.
        httpStatus: 200
        product:
          names: ["Apache HTTP Server", "Apache httpd", "Apache"]
          versionPrefix: "2.4.49"
          cpe: "cpe:2.3:a:apache:http_server:2.4.49"
        cves:
          mustInclude:
            - CVE-2021-41773
            - CVE-2021-42013
            - CVE-2021-44790
            - CVE-2022-22720
            - CVE-2024-38475
          kev:
            - CVE-2021-41773
            - CVE-2021-42013
            - CVE-2024-38475
      internet:
        ports: [443]
        httpStatus: 404
        httpTitleContains: "404 Not Found"
        product: null
        cves: {}
        note: >-
          Cloudflare terminates TLS and normalizes Server, so the origin's httpd version is not
          fingerprintable through the tunnel; the case proves the host is reachable on 443. The
          lab profile is where the CPE/CVE assertions run.

  - id: nginx-1.16.0
    title: "nginx 1.16.0 - HTTP/2 DoS and resolver issues (CVE-2019-9511, CVE-2019-9513, CVE-2021-23017)"
    imageEnv: AEGIS_VULNLAB_NGINX_IMAGE
    imageVersion: "1.16.0"
    version: "1.16.0"
    license: BSD-2-Clause
    service: nginx
    imagePort: 80
    request:
      path: /
    disclose:
      status: 200
      server: "nginx/1.16.0"
      bodyContains: ["Welcome to nginx!"]
    lab:
      address: 10.114.53.62
      port: 80
    internet:
      hostEnv: AEGIS_VULNLAB_HOST_NGINX
    expect:
      lab:
        ip: 10.114.53.62
        ports: [80]
        httpStatus: 200
        httpTitleContains: "Welcome to nginx"
        product:
          names: ["nginx", "Nginx"]
          versionPrefix: "1.16.0"
          cpe: "cpe:2.3:a:f5:nginx:1.16.0"
        cves:
          mustInclude:
            - CVE-2019-20372
            - CVE-2019-9511
            - CVE-2019-9513
            - CVE-2021-23017
            - CVE-2023-44487
          kev:
            - CVE-2023-44487
      internet:
        ports: [443]
        httpStatus: 200
        httpTitleContains: "Welcome to nginx"
        product: null
        cves: {}
        note: "Cloudflare normalizes Server; the origin's nginx version is not visible over the tunnel."

  - id: tomcat-8.5.19
    title: "Apache Tomcat 8.5.19 - PUT on read-only false (CVE-2017-12617) and Ghostcat (CVE-2020-1938)"
    imageEnv: AEGIS_VULNLAB_TOMCAT_IMAGE
    imageVersion: "8.5.19"
    version: "8.5.19"
    license: "Apache-2.0 (image: vulhub, MIT)"
    service: tomcat
    imagePort: 8080
    request:
      path: /
    disclose:
      status: 200
      bodyContains: ["Apache Tomcat/8.5.19"]
    lab:
      address: 10.114.53.63
      port: 8080
    internet:
      hostEnv: AEGIS_VULNLAB_HOST_TOMCAT
    expect:
      lab:
        ip: 10.114.53.63
        ports: [8080]
        httpStatus: 200
        httpTitleContains: "Apache Tomcat/8.5.19"
        product:
          names: ["Apache Tomcat", "Tomcat"]
          versionPrefix: "8.5.19"
          cpe: "cpe:2.3:a:apache:tomcat:8.5.19"
        cves:
          mustInclude:
            - CVE-2017-12617
            - CVE-2019-0221
            - CVE-2020-1938
            - CVE-2020-13934
            - CVE-2023-44487
            - CVE-2025-24813
          kev:
            - CVE-2017-12617
            - CVE-2020-1938
            - CVE-2023-44487
            - CVE-2025-24813
          mustNotInclude:
            # CVE-2017-12615 is Tomcat 7.0.0-7.0.79 only; a matcher that drops the version range
            # reports it for 8.5.19 too (vulhub's directory name is the misleading part).
            - CVE-2017-12615
      internet:
        ports: [443]
        httpStatus: 200
        httpTitleContains: "Apache Tomcat/8.5.19"
        product:
          names: ["Apache Tomcat", "Tomcat"]
          versionPrefix: "8.5.19"
          cpe: "cpe:2.3:a:apache:tomcat:8.5.19"
        cves:
          mustInclude:
            - CVE-2017-12617
            - CVE-2020-1938
            - CVE-2025-24813
          kev:
            - CVE-2017-12617
            - CVE-2020-1938
            - CVE-2025-24813
          mustNotInclude:
            - CVE-2017-12615
        note: "The default ROOT page carries the version in its title, so it survives Cloudflare."

  - id: spring-webmvc-5.3.17
    title: "Spring MVC 5.3.17 on Tomcat 8.5.77 - Spring4Shell demo (CVE-2022-22965 is G2 dynamic)"
    imageEnv: AEGIS_VULNLAB_SPRING_IMAGE
    imageVersion: "5.3.17"
    version: "8.5.77"
    license: "Apache-2.0 (image: vulhub, MIT)"
    service: spring
    readOnlyRootfs: false
    readOnlyReason: >-
      Tomcat unpacks ROOT.war into webapps/ on start; a read-only rootfs either hides the war
      behind a tmpfs or blocks the unpack. The container still has no host mount, all
      capabilities dropped, no-new-privileges and caps on memory/CPU/PIDs.
    imagePort: 8080
    request:
      path: /nosuch
    disclose:
      # Missing page: 404 with the Tomcat error page (it prints its version). `/` is the hello page
      # and prints nothing about the stack (evidence: G1.6b, 2026-11-25).
      status: 404
      bodyContains: ["Apache Tomcat/8.5.77"]
    lab:
      address: 10.114.53.64
      port: 8080
    internet:
      hostEnv: AEGIS_VULNLAB_HOST_SPRING
    expect:
      lab:
        ip: 10.114.53.64
        ports: [8080]
        # Evidence (G1.6b run, 2026-11-25, probe from aegis-lab-lab): `GET /` answers 200 with
        # `<h2>Hello, my name is , I am  years old.</h2>`, no Server header and no product marker.
        # The embedded Tomcat 8.5.77 is not disclosed anywhere in the response, so the chain cannot
        # identify it and no CVE can be asserted for this origin as it is built. A Spring/Tomcat
        # case needs the origin to disclose its stack (a marker the catalog can pin) - that is a
        # vulnlab-origin change, not an adapter or matcher change.
        httpStatus: 200
      internet:
        ports: [443]
        httpStatus: 404
        httpTitleContains: "HTTP Status 404"
        product:
          names: ["Apache Tomcat", "Tomcat"]
          versionPrefix: "8.5.77"
          cpe: "cpe:2.3:a:apache:tomcat:8.5.77"
        cves:
          mustInclude:
            - CVE-2022-42252
            - CVE-2025-24813
          kev:
            - CVE-2025-24813
          mustNotInclude:
            - CVE-2022-22965

  - id: jenkins-2.138
    title: "Jenkins 2.138 - Stapler RCE (CVE-2018-1000861) and CLI file read (CVE-2024-23897)"
    imageEnv: AEGIS_VULNLAB_JENKINS_IMAGE
    imageVersion: "2.138"
    version: "2.138"
    license: MIT
    service: jenkins
    imagePort: 8080
    request:
      path: /login
    disclose:
      # `/login` is 200 and carries `X-Jenkins: 2.138`; `/` answers 403 with the same header.
      status: 200
      bodyContains: ["Jenkins"]
    lab:
      address: 10.114.53.65
      port: 8080
    internet:
      hostEnv: AEGIS_VULNLAB_HOST_JENKINS
    expect:
      lab:
        ip: 10.114.53.65
        ports: [8080]
        # Evidence (G1.6b, 2026-11-25): `GET /` answers 403 with `X-Jenkins: 2.138` and
        # `Server: Jetty(9.4.z-SNAPSHOT)`; `/login` answers 200 with the same header. The 403 body
        # is a redirect stub, so no title is asserted; the version comes from that header.
        httpStatus: 403
        product:
          names: ["Jenkins", "Jenkins CI"]
          versionPrefix: "2.138"
          cpe: "cpe:2.3:a:jenkins:jenkins:2.138"
        cves:
          mustInclude:
            - CVE-2018-1000861
            - CVE-2019-1003003
            - CVE-2020-2100
            - CVE-2021-21639
            - CVE-2024-23897
          kev:
            - CVE-2018-1000861
            - CVE-2024-23897
          mustNotInclude:
            # CVE-2019-1003000 is 2.137 and older; 2.138 must not inherit it.
            - CVE-2019-1003000
      internet:
        ports: [443]
        httpStatus: 200
        httpTitleContains: "Jenkins"
        product: null
        cves: {}
        note: >-
          Jenkins sends its version in the X-Jenkins header, which Cloudflare may strip; the header
          is not asserted until the first tunnel run shows it survives (owner note on item 61). The
          login page title still proves the app is reachable through the tunnel and Cloudflare Access.

  - id: jetty-9.4.40
    title: "Eclipse Jetty 9.4.40 - servlet/URI issues (CVE-2021-28169, CVE-2021-34429, CVE-2024-8184)"
    imageEnv: AEGIS_VULNLAB_JETTY_IMAGE
    imageVersion: "9.4.40"
    version: "9.4.40.v20210413"
    license: "EPL-2.0 OR Apache-2.0"
    service: jetty
    readOnlyRootfs: false
    readOnlyReason: >-
      The official Jetty entrypoint writes jetty.start into /var/lib/jetty, next to the webapps it
      serves; a tmpfs there would hide them. The container still has no host mount, all
      capabilities dropped and caps on memory/CPU/PIDs.
    imagePort: 8080
    request:
      path: /nosuch
    disclose:
      status: 404
      server: "Jetty(9.4.40.v20210413)"
      bodyContains: ["Powered by Jetty:// 9.4.40.v20210413"]
    lab:
      address: 10.114.53.66
      port: 8080
    internet:
      hostEnv: AEGIS_VULNLAB_HOST_JETTY
    expect:
      lab:
        ip: 10.114.53.66
        ports: [8080]
        httpStatus: 404
        httpTitleContains: "Error 404 - Not Found"
        product:
          names: ["Jetty", "Eclipse Jetty"]
          versionPrefix: "9.4.40"
          cpe: "cpe:2.3:a:eclipse:jetty:9.4.40"
        cves:
          mustInclude:
            - CVE-2021-28169
            - CVE-2021-34428
            - CVE-2021-34429
            - CVE-2023-44487
            - CVE-2024-8184
          kev:
            - CVE-2023-44487
      internet:
        ports: [443]
        httpStatus: 404
        httpTitleContains: "Error 404 - Not Found"
        product:
          names: ["Jetty", "Eclipse Jetty"]
          versionPrefix: "9.4.40"
          cpe: "cpe:2.3:a:eclipse:jetty:9.4.40"
        cves:
          mustInclude:
            - CVE-2021-28169
            - CVE-2023-44487
          kev:
            - CVE-2023-44487
        note: "The Jetty error page carries the version in the body, so it survives Cloudflare."

  - id: struts2-2.3.30
    title: "Apache Struts2 2.3.30 (S2-045) - negative control: the Struts version is not disclosed"
    imageEnv: AEGIS_VULNLAB_STRUTS2_IMAGE
    imageVersion: "2.3.30"
    version: "2.3.30"
    license: "Apache-2.0 (image: vulhub, MIT)"
    service: struts2
    readOnlyRootfs: false
    readOnlyReason: >-
      The demo image runs `mvn jetty:run`, which compiles into /usr/src/target at start; a tmpfs
      there would hide the built webapp. The container still has no host mount, all capabilities
      dropped and caps on memory/CPU/PIDs.
    imagePort: 8080
    request:
      path: /
    disclose:
      status: 200
      server: "Jetty(9.2.11.v20150529)"
      bodyContains: ["Struts2 Showcase"]
    lab:
      address: 10.114.53.67
      port: 8080
    internet:
      hostEnv: AEGIS_VULNLAB_HOST_STRUTS2
    expect:
      lab:
        ip: 10.114.53.67
        ports: [8080]
        httpStatus: 200
        httpTitleContains: "Struts2 Showcase"
        product: null
        cves:
          mustNotInclude:
            # S2-045 is a Struts2 2.3.30 issue, but the app only reveals the Jetty container it
            # runs in; a banner matcher that attributes the Struts CVE is guessing. No product
            # assertion either: which of Jetty/Struts2 a detector reports here is up to slice B,
            # and the case's job is to prove no CVE is invented without a disclosed version.
            - CVE-2017-5638
        note: >-
          Negative control for the candidate matcher. The exploit itself is a G2 dynamic case; the
          only detection claim here is "reachable, and no Struts CVE without a version".
      internet:
        ports: [443]
        httpStatus: 200
        httpTitleContains: "Struts2 Showcase"
        product: null
        cves:
          mustNotInclude:
            - CVE-2017-5638
