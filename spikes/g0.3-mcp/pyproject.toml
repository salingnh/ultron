[project]
name = "aegis-mcp-spike"
version = "0.1.0"
description = "Spike G0.3a: Streamable HTTP MCP transport, _meta, idempotent tools/call, registry latency (throwaway, not merged)"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "jsonschema[format-nongpl]==4.26.0",
    "referencing==0.37.0",
    "openapi-spec-validator==0.9.0",
    "uvicorn==0.54.0",
    "httpx2==2.16.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
