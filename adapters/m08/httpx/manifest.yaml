apiVersion: aegis.io/v2
kind: CapabilityProvider
metadata:
  name: httpx
  version: 1.0.2
  module: M08
  license: MIT
  upstream: https://github.com/projectdiscovery/httpx
  licenseNotes: MIT (LICENSE in the upstream repository). Pin v1.12.0 is a published image
    (docker.io/projectdiscovery/httpx@sha256:f8275a7c...) and the adapter must not claim behaviour
    of another tag.
spec:
  capability: web.probe_http
  providerVersion: v1.12.0
  runtime:
    type: container
    image: registry.internal/aegis/httpx
    imageDigest: sha256:f8275a7c6aaec187249df9eaf4ad9196f4677adfc6a51a47b4aaa1d4db4f8ffc
    argsTemplate:
    - -l
    - /in/targets.txt
    - -json
    - -silent
    - -duc
    - -o
    - /out/result.jsonl
    - -tech-detect
    - -cpe
    - -tls-grab
    - -irh
    - -irr
    - -threads
    - ${input.concurrency}
    - -timeout
    - ${input.timeout_seconds}
    - -no-color
    targetsFormat: host_port
    outputPath: /out
  inputSchemaRef: schema://web/probe-http/v2
  outputSchemaRef: schema://common/result-envelope/v2
  acceptsTargetKinds:
  - service
  permissions:
    scopeRequired: false
    networkAccess: egress
    egressMode: broker
    # httpx takes -proxy (http or socks5) for every request it makes, so the broker can be its only
    # route; the proxy path is exercised by the adapter's lab proxy test (see the adapter README).
    proxyAware: true
    egressSources: []
    targetBinding: required
    targetPorts: from_input
    rawSocket: false
  budget:
    timeoutSeconds: 180
    maxConcurrency: 8
    cpu: 0.5
    memoryMb: 256
    maxOutputMb: 32
  handlers:
  - describe
  - validate
  - start
  - status
  - cancel
  - collect
  - health
  parser:
    entrypoint: adapters.m08.httpx.parser:parse
    outputFormat: jsonl
  emits:
    assetKinds:
    - application
    predicates:
    - http.status
    - http.title
    - http.headers
    - http.technology
    - tls.certificate
    - service.product
    relationships:
    - SERVES
    findings: false
  compatibilityTests:
  - schema
  - policy
  - cancellation
  - idempotency
  - fixture-replay
  - network-isolation
