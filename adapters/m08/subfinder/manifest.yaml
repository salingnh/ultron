apiVersion: aegis.io/v2
kind: CapabilityProvider
metadata:
  name: subfinder
  version: 1.0.4
  module: M08
  license: MIT
  upstream: https://github.com/projectdiscovery/subfinder
spec:
  capability: dns.enumerate_subdomains
  providerVersion: v2.17.0
  runtime:
    type: container
    image: registry.internal/aegis/subfinder
    imageDigest: sha256:2f5ddea311db2a8b848e40f1b669fc655d0eb78b74a74ead93d3850e372b12bf
    argsTemplate:
    - -silent
    - -duc
    - -json
    - -o
    - /out/result.jsonl
    - -dL
    - /in/targets.txt
    - -t
    - ${input.concurrency}
    - -rl
    - ${input.rate_limit}
    outputPath: /out
  inputSchemaRef: schema://dns/enumerate-subdomains/v2
  outputSchemaRef: schema://common/result-envelope/v2
  acceptsTargetKinds:
  - domain
  permissions:
    scopeRequired: false
    networkAccess: egress
    egressMode: broker
    proxyAware: true
    proxyFlag: -proxy
    egressSources:
    - id: crtsh
      hosts:
      - crt.sh
      ports:
      - 443
      protocol: https
      purpose: passive certificate transparency
    - id: alienvault
      hosts:
      - otx.alienvault.com
      ports:
      - 443
      protocol: https
      purpose: passive DNS (AlienVault OTX; the source id is the tool's source name)
    - id: hackertarget
      hosts:
      - api.hackertarget.com
      ports:
      - 443
      protocol: https
      purpose: passive host search
    - id: rapiddns
      hosts:
      - rapiddns.io
      ports:
      - 443
      protocol: https
      purpose: passive DNS records
    - id: waybackarchive
      hosts:
      - web.archive.org
      ports:
      - 80
      - 443
      protocol: https
      purpose: passive URL/domain archive
    - id: commoncrawl
      hosts:
      - index.commoncrawl.org
      ports:
      - 443
      protocol: https
      purpose: passive crawl index
    targetBinding: none
    rawSocket: false
  budget:
    timeoutSeconds: 900
    maxConcurrency: 4
    cpu: 1
    memoryMb: 512
    maxOutputMb: 64
  handlers:
  - describe
  - validate
  - start
  - status
  - cancel
  - collect
  - health
  parser:
    entrypoint: adapters.m08.subfinder.parser:parse
    outputFormat: jsonl
  emits:
    assetKinds:
    - domain
    predicates:
    - asset.seen
    relationships:
    - SUBDOMAIN_OF
    findings: false
  compatibilityTests:
  - schema
  - policy
  - cancellation
  - idempotency
  - fixture-replay
  - network-isolation
  inputDefaults:
    recursive: false
