# Lab configuration served by both web instances (G1.6b).
#
# `server_tokens` is on so the response says `nginx/1.29.8`: the point of the slice is to read a
# product and version off a real service, and the lab must therefore publish the one its image
# actually runs (port 8080 = HTTP, 8443 = HTTPS; both non-default on purpose, so the port is part
# of the service identity in every fixture).
server {
    listen 8080;
    server_name _;

    server_tokens on;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
