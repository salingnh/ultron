# HTTPS side of the lab web pair (G1.6b).
#
# The certificate is generated by `make lab-up` into deploy/lab/.run/tls (throwaway, never
# committed) with CN=IP:10.114.53.22 and a SAN for both lab addresses, so the TLS evidence a probe
# reads is a real certificate of the lab, not a stub. The key is world-readable inside the lab
# because the unprivileged nginx (uid 101) must open it; it exists for this run only.
server {
    listen 8443 ssl;
    server_name _;

    server_tokens on;
    ssl_certificate     /etc/nginx/lab-tls/lab-web.crt;
    ssl_certificate_key /etc/nginx/lab-tls/lab-web.key;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
