# nginx 1.18.0 in the authorized lab (G1.6a): HTTP 80 and HTTPS 443, no upstream, no proxy.
#
# The certificate is signed by the throwaway lab CA `make lab-up` generates in
# deploy/lab/.run/tls (never committed), so the lab has a real TLS handshake without a public
# identity. Every answer is a fixed string: the lab is a target to *observe*, not a web site.
server {
    listen 80 default_server;
    server_name web.lab.aegis.test _;

    # No static files and no proxy: one constant answer, so the port scan and the later web probe
    # see the same thing on every run.
    location / {
        default_type text/plain;
        return 200 "aegis lab web (nginx 1.18.0, http)\n";
    }
}

server {
    listen 443 ssl default_server;
    server_name web.lab.aegis.test _;

    ssl_certificate     /etc/nginx/tls/lab-web.crt;
    ssl_certificate_key /etc/nginx/tls/lab-web.key;
    # TLS 1.2 minimum, one modern suite set: the point is a real handshake with a lab-issued
    # certificate, not compatibility with old clients.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache off;

    location / {
        default_type text/plain;
        return 200 "aegis lab web (nginx 1.18.0, tls)\n";
    }
}
