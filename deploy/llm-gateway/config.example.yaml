# LLM gateway - file cấu hình của BẠN, không phải state của repo.
#
# Chép file này tới /home/admin/.config/ultron/llm-gateway/config.yaml rồi sửa ở đó.
# Ở đây CHỈ có endpoint và thứ tự ưu tiên. Những giá trị không được đổi (không log nội dung
# request/response, không retry, /metrics sau master key, không ghi spend log) nằm ở
# deploy/llm-gateway/base.yaml; `make llm-gateway-up` trộn file đó với file này. Đặt lại một
# trong các khoá đó ở đây sẽ bị từ chối, không bị bỏ qua im lặng.
#
# Key KHÔNG nằm ở đây: chúng nằm trong .env của checkout (xem .env.example), mỗi key là một biến
# như LLM_KEY_A; file này chỉ ghi TÊN biến dưới dạng os.environ/<TÊN>.
#
# Thứ tự = thứ tự trong danh sách `endpoints` bên dưới: trên cùng thử trước. Khi endpoint đầu hết
# quota (429), lỗi 5xx hoặc timeout, gateway gọi endpoint kế tiếp và cho endpoint lỗi nghỉ
# `cooldown_time` giây (300). Hết cả nhóm thì trả 429 kèm danh sách endpoint đang nghỉ - ultron ghi
# đó là lỗi provider, không crash.
#
# group: tên nhóm, chính là AEGIS_MODEL_NAME trong .env (client chỉ gọi tên nhóm này).
group: aegis-smart

endpoints:
  # Endpoint OpenAI-compatible: vLLM, LM Studio, OpenRouter, một nhà cung cấp...
  - name: aegis-endpoint-a
    model: openai/gpt-4o-mini
    api_base: https://api.openai.com/v1
    # Tên biến trong .env, không phải giá trị key.
    api_key: os.environ/LLM_KEY_A
    # Giá USD/token: tuỳ chọn (có thì gateway báo chi phí thật trong x-litellm-response-cost;
    # không có thì gateway báo 0 và ultron dùng AEGIS_MODEL_PRICE_* trong .env).
    input_cost_per_token: 0.00000015
    output_cost_per_token: 0.0000006

  # Endpoint OpenAI-compatible thứ hai: nơi chuyển sang khi A hết quota hoặc lỗi.
  - name: aegis-endpoint-b
    model: openai/gpt-4o-mini
    api_base: https://api.example-provider.net/v1
    api_key: os.environ/LLM_KEY_B
    input_cost_per_token: 0.00000015
    output_cost_per_token: 0.0000006

  # Endpoint Anthropic: không cần api_base (mặc định của hãng).
  # Ultron gọi chuẩn nào cũng qua được: lời gọi OpenAI được dịch sang Anthropic Messages và ngược
  # lại. Upstream chỉ nói /v1/chat/completions thì đặt AEGIS_MODEL_PROVIDER=openai trong .env.
  - name: aegis-endpoint-c
    model: anthropic/claude-3-5-sonnet-latest
    api_key: os.environ/LLM_KEY_C
    input_cost_per_token: 0.000003
    output_cost_per_token: 0.000015

# Bỏ một endpoint: xoá cả khối của nó ở trên; thứ tự các endpoint còn lại tự dồn lại.
# Thêm một endpoint: thêm một khối nữa, rồi thêm LLM_KEY_<x>=<key> trong .env.
# Sửa xong: make llm-gateway-reload   (ultron vẫn chạy, gateway gián đoạn vài giây)
