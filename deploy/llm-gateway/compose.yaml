# LLM gateway for AEGIS-Vanguard (G1.6): one local LiteLLM proxy in front of the owner's model
# endpoints, which rotates to the next endpoint when one runs out of quota (429), fails with 5xx or
# times out. ultron reaches only this proxy.
#
# Two inputs, and neither is mounted as-is:
#   * the owner's endpoints - outside every checkout
#     (`/home/admin/.config/ultron/llm-gateway/config.yaml`, edited by hand);
#   * every key and setting - the checkout's `.env`, the same file ultron reads.
# `make llm-gateway-up` renders them into `.local/llm-gateway/` (the owner's endpoints merged over
# the fixed `deploy/llm-gateway/base.yaml`, plus an environment file holding ONLY the variables that
# config references, never the whole .env) and the container gets those two files. Nothing in the
# owner's directory is visible to the container, and a stale render cannot be mounted: up/reload
# regenerate before they create anything.
#
# Run it through `make llm-gateway-up` / `llm-gateway-down` / `llm-gateway-status` /
# `llm-gateway-reload` (scripts/llm-gateway/*.sh): they validate the inputs before a container
# exists, keep the compose project to this checkout (scripts/lib/stack.sh, the #71 rule), wait for
# readiness and read the routing state back. Direct `podman-compose up` runs skip all of it.
#
# Isolation, in one place:
#   * project name `aegis-llm-gateway` is the only stack these scripts create or remove;
#   * published on 127.0.0.1 only, so no other host on the network can spend the owner's quota;
#     the one network it joins (`<project>-net`) is how a containerised ultron reaches it;
#   * rootless podman, read-only rootfs, cap_drop ALL, no-new-privileges, memory/CPU/PID caps;
#   * the only host mount is the rendered config directory, read-only; the environment file is
#     readable by the container's user and is 0600 on the host;
#   * request/response bodies are never logged (base.yaml: turn_off_message_logging); the metadata an
#     operator needs (model, endpoint, status, tokens, cost, latency) comes from the gateway's
#     /metrics and from `aegis.model_usage`, which M04 writes from the gateway's
#     x-litellm-response-cost header.
#
# The image is pinned by digest (deploy/llm-gateway/images.env) and is the MIT-licensed LiteLLM
# proxy: no enterprise feature is used (no spend logs in a database, no UI, no SSO), which is why
# the stack has no PostgreSQL and `disable_spend_logs` is set.
name: ${AEGIS_LLM_GATEWAY_PROJECT:-aegis-llm-gateway}

services:
  gateway:
    image: ${AEGIS_LLM_GATEWAY_IMAGE:?run through make llm-gateway-up so deploy/llm-gateway/images.env is loaded}
    container_name: ${AEGIS_LLM_GATEWAY_PROJECT:-aegis-llm-gateway}-gateway
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # LiteLLM imports a large Python stack at boot: 512m is OOM-killed during start-up (measured),
    # 2g is the pinned image's own starting point. The proxy holds no request/response bodies.
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 256
    # `config.yaml` here is the RENDERED document (owner's endpoints + fixed base); it is read once
    # at boot, which is what `make llm-gateway-reload` recreates this one container for - ultron
    # keeps running.
    command:
      - --config
      - /app/config/config.yaml
      - --host
      - 0.0.0.0
      - --port
      - "4000"
    environment:
      # Non-secret settings only. Every key - the master key and each upstream key - comes through
      # the generated environment file below, which holds exactly the variables config.yaml
      # references and nothing else from .env.
      LITELLM_LOG: INFO
      LITELLM_MODE: PRODUCTION
      # A proxy needs a master key to answer clients at all; the rendered config reads the same
      # variable through `os.environ/AEGIS_MODEL_API_KEY` (so a missing key is a start-up error, not
      # an open proxy).
      DISABLE_SCHEMA_UPDATE: "True"
    env_file:
      - ${AEGIS_LLM_GATEWAY_ENV_FILE:?run through make llm-gateway-up so the rendered environment file is set}
    ports:
      # Loopback only: a published 0.0.0.0 port would let any peer on the network spend the quota.
      - "127.0.0.1:${AEGIS_LLM_GATEWAY_PORT:-4000}:4000"
    volumes:
      # The rendered config directory, read-only and shared-labelled (`z`, never `Z`: the next render
      # in this checkout must still be able to write it). The proxy runs as a non-root user from the
      # image (`nonroot`, uid 65532), which is why render.py leaves the directory traversable and
      # `config.yaml` world-readable - it holds variable names only. The environment file next to it
      # is 0600 and is read by podman on the host, not by the container's user.
      - ${AEGIS_LLM_GATEWAY_RENDER_DIR:?run through make llm-gateway-up so the rendered config dir is set}:/app/config:ro,z
    tmpfs:
      # Python writes nothing but temporary files; the rootfs stays read-only.
      - /tmp:rw,size=64m,mode=1777
    healthcheck:
      # The image has no curl; the interpreter that serves the proxy answers instead.
      test:
        - CMD
        - python3
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness',timeout=3).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      gateway:

networks:
  # A fixed name so a containerised ultron can declare it `external: true` (the dev stack's
  # compose file is not the only possible caller). Nothing here is published beyond loopback.
  gateway:
    name: ${AEGIS_LLM_GATEWAY_PROJECT:-aegis-llm-gateway}-net
